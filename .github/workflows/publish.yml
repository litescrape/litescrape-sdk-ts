name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Check that the tag matches the package version
        run: node -e "const p = require('./package.json'); if ('v' + p.version !== process.env.GITHUB_REF_NAME) throw new Error('Tag must match package.json version')"
      - run: npm run check
      - run: npm pack
      - run: npm run test:package
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: "*.tgz"

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: package/
      - name: Publish with npm trusted publishing
        # npm provenance requires a public source repository.
        env:
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.private && 'false' || 'true' }}
        run: npm publish ./package/*.tgz --access public
